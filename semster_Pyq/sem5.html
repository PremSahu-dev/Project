<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sem1_pyq</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      min-height: 100vh;
      padding: 230px;
    }

    .container {
          width: 100%;
    max-width: 850px;
   
    }
    .question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .question-grid a {
      text-decoration: none;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #fff;
      text-align: center;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      transition: 0.3s;
    }

    .question-grid a:hover {
      transform: translateY(-5px);
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    .question-grid i {
      color: #00ff66;
      margin-left: 5px;
    }
  </style>
  <body>
    <div class="container">
      <div class="question-grid">
        <a href="sem5/SEM 5 2019-22.pdf" target="_blank"
          >2019-2022<i class="fa-solid fa-check"></i
        ></a>
        <a href="sem5/PYQ Sem 5 (2020-23).pdf" target="_blank"
          >2020-2023<i class="fa-solid fa-check"></i
        ></a>
        <a href="sem5/SEM 5 (2021-24).pdf" target="_blank"
          >2021-2024 <i class="fa-solid fa-check"></i
        ></a>
        <a href="sem5/BCA SEM 5 2022 2025.pdf" target="_blank"
          >2022-2025 <i class="fa-solid fa-check"></i
        ></a>
        <a href="#" target="_blank">2023-2026</a>
      </div>
    </div>
  </body>
</html>
