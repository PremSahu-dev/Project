<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sem3_study</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      min-height: 100vh;
      padding: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }
    .question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .question-grid a {
      text-decoration: none;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #fff;
      text-align: center;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      transition: 0.3s;
    }

    .question-grid a:hover {
      transform: translateY(-5px);
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    .question-grid i {
      color: #00ff66;
      margin-left: 5px;
    }
  </style>
  <body>
    <div class="container">
      <div class="question-grid">
        <a href="#">Syallbus </a>
        <a href="#">Data Sturcture using C  C3001</a>
        <a href="#">Java Programming C3002</a>
        <a href="#"> Computer Architecture C3003</a>
        <a href="#"> Systemn Analysis and Design C3004</a>
        <a href="#"> Probability and Statistics C3005</a>
      </div>
    </div>
  </body>
</html>
