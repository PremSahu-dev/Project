<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sem5_study</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      min-height: 100vh;
    padding: 100px;
    }

    .container {
      
         width: 100%;
    max-width: 850px;
    }
    .question-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .question-grid a {
      text-decoration: none;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #fff;
      text-align: center;
      padding: 14px;
      border-radius: 10px;
      font-weight: 600;
      transition: 0.3s;
    }

    .question-grid a:hover {
      transform: translateY(-5px);
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    .question-grid i {
      color: #00ff66;
      margin-left: 5px;
    }
  </style>
  <body>
    <div class="container">
      <div class="question-grid">
        <a href="sem5/SYLLBUS 5TH SEM.pdf"
          >Syallbus <i class="fa-solid fa-check"></i
        ></a>
        <a href="#">Internet Concept and Web Design C5001</a>
        <a href="#"> Design And Analysis of Algorithms C5002</a>
        <a href="sem5/Linux External.html.pdf"
          > Linux Programming C5003<i class="fa-solid fa-check"></i
        ></a>
        
        <a href="#"> Computer Oriented Numerical Methods C5004</a>
        <a href="#"> E-Commerece E5005</a>
      </div>
    </div>
  </body> 
</html>
